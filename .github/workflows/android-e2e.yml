name: Android E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-e2e:
    name: Maestro UI E2E (Android 35)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore Gradle dependencies and wrapper cache
        id: gradle-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-jdk21-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/gradle-wrapper.properties', 'buildSrc/**/Versions.kt', 'buildSrc/**/Dependencies.kt', 'gradle/*.versions.toml', '**/versions.properties') }}
          restore-keys: |
            ${{ runner.os }}-jdk21-gradle-

      - name: Restore Gradle build cache
        id: gradle-build-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-jdk21-gradle-build-${{ hashFiles('**/*.gradle*', '**/gradle.properties', 'gradle/*.versions.toml', '**/versions.properties') }}
          restore-keys: |
            ${{ runner.os }}-jdk21-gradle-build-

      - name: Enable KVM group permissions
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            ls -la /dev/kvm
          else
            echo "KVM device node /dev/kvm not found; emulator will use TCG fallback."
          fi

      - name: Run Maestro E2E on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: maestro test .maestro/

      - name: Save Gradle dependencies and wrapper cache
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-1
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Save Gradle build cache
        if: always() && steps.gradle-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ steps.gradle-build-cache.outputs.cache-primary-key }}
