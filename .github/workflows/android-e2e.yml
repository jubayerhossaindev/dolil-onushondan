name: Android E2E

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Maestro: pinned (the install script otherwise fetches the latest release).
  MAESTRO_VERSION: "2.12.1"
  # Maestro docs: default driver start-up wait is 15s on Android, too short for CI emulators.
  MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
  MAESTRO_CLI_NO_ANALYTICS: "1"
  EMU_API: "35"
  EMU_TARGET: default
  EMU_ARCH: x86_64

jobs:
  maestro-e2e:
    name: Maestro UI E2E (Android 35)
    # Pinned image: `ubuntu-latest` is migrating to Ubuntu 26.04 (Oct 19 - Nov 19, 2026).
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      # Gradle dependency + build cache (restores at start, saves at end).
      # Only `main` writes the cache; pull requests read it.
      - name: Set up Gradle (dependency + build cache)
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Prepare CI-only files (debug.keystore, google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # 1) Debug keystore expected at the repo root by signing config 'debugConfig'
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2) google-services.json: real one from secret, else a dummy so the build works (also on fork PRs)
          if [ -f app/google-services.json ]; then
            echo "app/google-services.json already present"
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            case "$GOOGLE_SERVICES_JSON" in
              "{"*) printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json ;;
              *)    printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json ;;
            esac
            echo "google-services.json written from secret"
          else
            echo "::warning::No GOOGLE_SERVICES_JSON secret; generating a dummy google-services.json (Firebase will not work at runtime)."
            python3 - <<'PY'
          import json, re, glob
          pkg, suffix = None, ""
          for f in glob.glob("app/build.gradle*"):
              t = open(f).read()
              m = re.search(r'applicationId\s*=?\s*["\']([^"\']+)["\']', t)
              if m: pkg = pkg or m.group(1)
              m = re.search(r'applicationIdSuffix\s*=?\s*["\']([^"\']+)["\']', t)
              if m: suffix = suffix or m.group(1)
              if not pkg:
                  m = re.search(r'namespace\s*=?\s*["\']([^"\']+)["\']', t)
                  if m: pkg = m.group(1)
          if not pkg: raise SystemExit("Could not detect applicationId in app/build.gradle*")
          names = [pkg] + ([pkg + suffix] if suffix else [])
          clients = [{
            "client_info": {"mobilesdk_app_id": "1:123456789012:android:%016x" % (i + 1),
                            "android_client_info": {"package_name": n}},
            "api_key": [{"current_key": "AIzaSyDummyKeyForCiOnly0000000000000000"}]
          } for i, n in enumerate(names)]
          json.dump({"project_info": {"project_number": "123456789012", "project_id": "ci-dummy",
                                      "storage_bucket": "ci-dummy.appspot.com"},
                     "client": clients, "configuration_version": "1"},
                    open("app/google-services.json", "w"), indent=2)
          print("Dummy google-services.json for", names)
          PY
          fi

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --build-cache --configuration-cache assembleDebug
          echo "APKs found:"
          find . -path '*build/outputs/apk/debug/*.apk' -not -path '*/androidTest/*'

      - name: Restore Maestro CLI cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.maestro
          key: maestro-${{ runner.os }}-${{ env.MAESTRO_VERSION }}

      - name: Install Maestro CLI
        run: |
          if [ ! -x "$HOME/.maestro/bin/maestro" ]; then
            curl -fsSL "https://get.maestro.mobile.dev" | bash
          fi
          sudo ln -sf "$HOME/.maestro/bin/maestro" /usr/local/bin/maestro
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      # GitHub hosts Linux runners on Azure and now also AWS (changelog 2026-10-28), and
      # nested virtualization is not guaranteed. So detect KVM instead of assuming it.
      - name: Enable KVM group permissions
        id: kvm
        run: |
          echo "Image: $(. /etc/os-release && echo "$PRETTY_NAME") | CPUs: $(nproc) | virt flags: $(grep -c -E 'vmx|svm' /proc/cpuinfo || true)"
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sleep 1
          fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            ls -la /dev/kvm
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KVM not usable on this runner; emulator will run in software mode (slower)."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create E2E runner script
        run: |
          mkdir -p "$RUNNER_TEMP/e2e" "$GITHUB_WORKSPACE/e2e-evidence"
          cat > "$RUNNER_TEMP/e2e/run.sh" <<'EOS'
          #!/usr/bin/env bash
          set -uo pipefail
          export PATH="$HOME/.maestro/bin:/usr/local/bin:$PATH"
          OUT="$GITHUB_WORKSPACE/e2e-evidence"
          mkdir -p "$OUT"

          on_exit() {
            rc=$?
            adb logcat -d > "$OUT/logcat.txt" 2>&1 || true
            adb exec-out screencap -p > "$OUT/final-screen.png" 2>/dev/null || true
            if [ "$rc" -ne 0 ]; then
              echo "::group::Device info"
              adb devices -l || true
              adb shell getprop ro.build.version.sdk || true
              adb shell pm list packages 2>/dev/null | grep -Ei "maestro|dolil" || true
              echo "::endgroup::"
              echo "::group::Last 80 lines of Maestro output"
              tail -n 80 "$OUT/maestro-output.txt" 2>/dev/null || echo "(no Maestro output: failed before Maestro started)"
              echo "::endgroup::"
              echo "::group::Crashes / Maestro driver in logcat"
              grep -E "FATAL EXCEPTION|AndroidRuntime|dev.mobile.maestro|ANR in|has died" "$OUT/logcat.txt" 2>/dev/null | tail -n 80 || true
              echo "::endgroup::"
            fi
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "### Maestro E2E: $([ "$rc" -eq 0 ] && echo passed || echo FAILED)"
                echo "Evidence (JUnit, logcat, screenshots) is in the uploaded artifact."
                if [ "$rc" -ne 0 ] && [ -f "$OUT/maestro-output.txt" ]; then
                  echo '```'; tail -n 30 "$OUT/maestro-output.txt"; echo '```'
                fi
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit "$rc"
          }
          trap on_exit EXIT

          adb wait-for-device
          for i in $(seq 1 90); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] \
              && adb shell pm path android >/dev/null 2>&1 && break
            sleep 5
          done
          adb shell input keyevent 82 || true

          cd "$GITHUB_WORKSPACE"
          APK="$(find . -path '*build/outputs/apk/debug/*.apk' -not -path '*/androidTest/*' | head -n1)"
          if [ -z "$APK" ]; then echo "No debug APK found"; exit 1; fi
          echo "Installing $APK"
          ok=0
          for i in 1 2 3; do
            if adb install -r -t -g "$APK"; then ok=1; break; fi
            echo "adb install failed (attempt $i), retrying..."; sleep 10
          done
          [ "$ok" = 1 ] || exit 1

          for attempt in 1 2; do
            echo "=== Maestro attempt $attempt ==="
            if maestro test .maestro/ \
                --format junit \
                --output "$OUT/report.xml" \
                --test-output-dir "$OUT/maestro" \
                --debug-output "$OUT/maestro-debug" 2>&1 | tee -a "$OUT/maestro-output.txt"; then
              exit 0
            fi
            adb shell am force-stop dev.mobile.maestro 2>/dev/null || true
            sleep 15
          done
          exit 1
          EOS
          chmod +x "$RUNNER_TEMP/e2e/run.sh"

      # AVD snapshot cache: only with KVM (snapshot boot takes seconds instead of minutes)

      # AVD snapshot cache (official emulator-runner pattern). Only useful with KVM.
      - name: Restore AVD cache
        if: steps.kvm.outputs.available == 'true'
        id: avd-cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-api${{ env.EMU_API }}-${{ env.EMU_ARCH }}-${{ env.EMU_TARGET }}-v2

      - name: Create AVD and snapshot (cache miss only)
        if: steps.kvm.outputs.available == 'true' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMU_API }}
          target: ${{ env.EMU_TARGET }}
          arch: ${{ env.EMU_ARCH }}
          cores: 2
          ram-size: 4096M
          disk-size: 8G
          force-avd-creation: false
          disable-animations: false
          disable-linux-hw-accel: false
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "AVD snapshot generated for caching."

      - name: Run Maestro E2E on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMU_API }}
          target: ${{ env.EMU_TARGET }}
          arch: ${{ env.EMU_ARCH }}
          cores: 2
          ram-size: 4096M
          disk-size: 8G
          force-avd-creation: false
          disable-animations: true
          # Official input: explicitly choose hardware vs software acceleration (no manual -accel flags).
          disable-linux-hw-accel: ${{ steps.kvm.outputs.available == 'true' && 'false' || 'true' }}
          emulator-boot-timeout: 1200
          emulator-options: ${{ steps.kvm.outputs.available == 'true' && '-no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none' || '-no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none' }}
          script: bash ${{ runner.temp }}/e2e/run.sh

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-evidence-${{ github.run_id }}
          path: |
            e2e-evidence/**
            ~/.maestro/tests/**
          if-no-files-found: warn
          retention-days: 7
