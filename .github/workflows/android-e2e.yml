name: Android E2E

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAESTRO_VERSION: "2.12.1"
  MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
  MAESTRO_CLI_NO_ANALYTICS: "1"
  ANDROID_API_LEVEL: "35"
  ANDROID_TARGET: "google_apis"
  ANDROID_ARCH: "x86_64"
  ANDROID_DEVICE_PROFILE: "pixel_5"

jobs:
  maestro-e2e:
    name: Maestro UI E2E (Android 35)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK, emulator, and API 35 system image
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools emulator system-images;android-35;google_apis;x86_64'

      - name: Install Android Emulator Linux runtime library
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libpulse0

          ldconfig -p | grep -F 'libpulse.so.0'

      - name: Verify Android SDK emulator tools
        shell: bash
        run: |
          set -euo pipefail

          : "${ANDROID_HOME:?ANDROID_HOME is not set}"
          command -v adb
          command -v sdkmanager
          command -v avdmanager
          test -x "$ANDROID_HOME/emulator/emulator"

          test -x "$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64"

          adb version
          # Use the official emulator launcher for runtime validation. It prepares
          # LD_LIBRARY_PATH for the bundled QEMU/Qt libraries before starting QEMU.
          "$ANDROID_HOME/emulator/emulator" -version

      - name: Set up Gradle dependency and build cache
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Prepare CI-only files (debug.keystore, google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -f app/google-services.json ]; then
            echo "app/google-services.json already present"
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            case "$GOOGLE_SERVICES_JSON" in
              "{"*) printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json ;;
              *)    printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json ;;
            esac
            echo "google-services.json written from secret"
          else
            echo "::warning::No GOOGLE_SERVICES_JSON secret; generating a dummy google-services.json (Firebase runtime services are unavailable in this CI job)."
            python3 - <<'PY'
          import json
          package_name = "com.dolil.onushodan"
          payload = {
              "project_info": {
                  "project_number": "123456789012",
                  "project_id": "ci-dummy",
                  "storage_bucket": "ci-dummy.appspot.com",
              },
              "client": [{
                  "client_info": {
                      "mobilesdk_app_id": "1:123456789012:android:0000000000000001",
                      "android_client_info": {"package_name": package_name},
                  },
                  "api_key": [{"current_key": "AIzaSyDummyKeyForCiOnly0000000000000000"}],
              }],
              "configuration_version": "1",
          }
          with open("app/google-services.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2)
          PY
          fi

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --build-cache --configuration-cache assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Restore Maestro CLI cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.maestro
          key: maestro-${{ runner.os }}-${{ env.MAESTRO_VERSION }}

      - name: Install pinned Maestro CLI
        run: |
          if [ ! -x "$HOME/.maestro/bin/maestro" ]; then
            curl -fsSL "https://get.maestro.mobile.dev" | bash
          fi
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      # The emulator is created and booted exactly once by the repository runner script.
      # Do not use android-emulator-runner here: its post-boot KEYCODE_MENU injection
      # caused a Pixel Launcher ANR on this headless runner and an AVD snapshot then
      # carried that system dialog into the actual E2E session.
      - name: Run full Maestro E2E suite on a fresh Android 35 emulator
        run: bash scripts/run-maestro-e2e.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Surface failure details
        if: failure()
        run: |
          d="build/maestro-results"
          echo "Evidence directory: $d"
          if [ -d "$d" ]; then
            find "$d" -maxdepth 4 -type f -printf '%p (%s bytes)\n' | sort
            for f in "$d"/*.txt "$d"/*.log; do
              [ -f "$f" ] || continue
              echo "::group::$(basename "$f")"
              tail -n 80 "$f"
              echo "::endgroup::"
            done
          fi

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-e2e-evidence-${{ github.run_id }}
          path: |
            build/maestro-results/
            ~/.maestro/tests/
          if-no-files-found: warn
          retention-days: 14
