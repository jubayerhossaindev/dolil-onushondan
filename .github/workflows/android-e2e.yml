name: Android E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-e2e:
    name: Maestro UI E2E (Android 35)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore Gradle dependencies and wrapper cache
        id: gradle-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-jdk21-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/gradle-wrapper.properties', 'buildSrc/**/Versions.kt', 'buildSrc/**/Dependencies.kt', 'gradle/*.versions.toml', '**/versions.properties') }}
          restore-keys: |
            ${{ runner.os }}-jdk21-gradle-

      - name: Restore Gradle task output cache
        id: gradle-build-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-jdk21-gradle-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-jdk21-gradle-build-

      - name: Prepare Gradle task output cache directory
        run: mkdir -p ~/.gradle/caches/build-cache-1

      - name: Generate debug keystore
        run: |
          if [[ ! -f debug.keystore ]]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Create isolated Firebase configuration
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.dolil.onushodan"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy-key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --build-cache --no-configuration-cache --stacktrace --warning-mode all \
            :app:assembleDebug

      - name: Save Gradle dependencies and wrapper cache
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-1
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Save Gradle task output cache
        if: always() && steps.gradle-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ steps.gradle-build-cache.outputs.cache-primary-key }}

      - name: Install pinned Maestro CLI
        env:
          MAESTRO_VERSION: 2.12.1
        run: |
          export MAESTRO_VERSION
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Run Maestro on Android emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/run-maestro-e2e.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Maestro evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-e2e-evidence-${{ github.run_id }}
          path: build/maestro-results/
          if-no-files-found: warn
          retention-days: 14
