name: Android E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
  MAESTRO_CLI_NO_ANALYTICS: "1"

jobs:
  maestro-e2e:
    name: Maestro UI E2E (Android 35)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore Gradle dependencies and wrapper cache
        id: gradle-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-jdk21-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/gradle-wrapper.properties', 'buildSrc/**/Versions.kt', 'buildSrc/**/Dependencies.kt', 'gradle/*.versions.toml', '**/versions.properties') }}
          restore-keys: |
            ${{ runner.os }}-jdk21-gradle-

      - name: Restore Gradle build cache
        id: gradle-build-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-jdk21-gradle-build-${{ hashFiles('**/*.gradle*', '**/gradle.properties', 'gradle/*.versions.toml', '**/versions.properties') }}
          restore-keys: |
            ${{ runner.os }}-jdk21-gradle-build-

      - name: Prepare CI-only files (debug.keystore, google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # 1) Debug keystore expected at the repo root by signing config 'debugConfig'
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2) google-services.json: real one from secret, else a dummy so the build works (also on fork PRs)
          if [ -f app/google-services.json ]; then
            echo "app/google-services.json already present"
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            case "$GOOGLE_SERVICES_JSON" in
              "{"*) printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json ;;
              *)    printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json ;;
            esac
            echo "google-services.json written from secret"
          else
            echo "::warning::No GOOGLE_SERVICES_JSON secret; generating a dummy google-services.json (Firebase will not work at runtime)."
            python3 - <<'PY'
          import json, re, glob
          pkg, suffix = None, ""
          for f in glob.glob("app/build.gradle*"):
              t = open(f).read()
              m = re.search(r'applicationId\s*=?\s*["\']([^"\']+)["\']', t)
              if m: pkg = pkg or m.group(1)
              m = re.search(r'applicationIdSuffix\s*=?\s*["\']([^"\']+)["\']', t)
              if m: suffix = suffix or m.group(1)
              if not pkg:
                  m = re.search(r'namespace\s*=?\s*["\']([^"\']+)["\']', t)
                  if m: pkg = m.group(1)
          if not pkg: raise SystemExit("Could not detect applicationId in app/build.gradle*")
          names = [pkg] + ([pkg + suffix] if suffix else [])
          clients = [{
            "client_info": {"mobilesdk_app_id": "1:123456789012:android:%016x" % (i + 1),
                            "android_client_info": {"package_name": n}},
            "api_key": [{"current_key": "AIzaSyDummyKeyForCiOnly0000000000000000"}]
          } for i, n in enumerate(names)]
          json.dump({"project_info": {"project_number": "123456789012", "project_id": "ci-dummy",
                                      "storage_bucket": "ci-dummy.appspot.com"},
                     "client": clients, "configuration_version": "1"},
                    open("app/google-services.json", "w"), indent=2)
          print("Dummy google-services.json for", names)
          PY
          fi

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --build-cache assembleDebug
          echo "APKs found:"
          find . -path '*build/outputs/apk/debug/*.apk' -not -path '*/androidTest/*'

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          export PATH="$HOME/.maestro/bin:$PATH"
          if [ -x "$HOME/.maestro/bin/maestro" ]; then
            sudo ln -sf "$HOME/.maestro/bin/maestro" /usr/local/bin/maestro
          fi
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          maestro --version

      - name: Enable KVM group permissions
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            ls -la /dev/kvm
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KVM unavailable; using software emulation (TCG), which is slow."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # emulator-runner runs every script line in a separate shell,
      # so the real logic lives in a script file.
      - name: Create E2E runner script
        run: |
          mkdir -p "$RUNNER_TEMP/e2e" "$GITHUB_WORKSPACE/e2e-evidence"
          cat > "$RUNNER_TEMP/e2e/run.sh" <<'EOS'
          #!/usr/bin/env bash
          set -uo pipefail
          export PATH="$HOME/.maestro/bin:/usr/local/bin:$PATH"
          OUT="$GITHUB_WORKSPACE/e2e-evidence"
          mkdir -p "$OUT"
          trap 'adb logcat -d > "$OUT/logcat.txt" 2>&1 || true; adb exec-out screencap -p > "$OUT/final-screen.png" 2>/dev/null || true' EXIT

          adb wait-for-device
          for i in $(seq 1 90); do
            adb shell pm path android >/dev/null 2>&1 && break
            sleep 5
          done
          adb shell input keyevent 82 || true

          cd "$GITHUB_WORKSPACE"
          APK="$(find . -path '*build/outputs/apk/debug/*.apk' -not -path '*/androidTest/*' | head -n1)"
          if [ -z "$APK" ]; then echo "No debug APK found"; exit 1; fi
          echo "Installing $APK"
          ok=0
          for i in 1 2 3; do
            if adb install -r -t -g "$APK"; then ok=1; break; fi
            echo "adb install failed (attempt $i), retrying..."; sleep 10
          done
          [ "$ok" = 1 ] || exit 1

          for attempt in 1 2; do
            echo "=== Maestro attempt $attempt ==="
            if maestro test .maestro/ \
                --format junit \
                --output "$OUT/report.xml" \
                --test-output-dir "$OUT/maestro" \
                --debug-output "$OUT/maestro-debug"; then
              exit 0
            fi
            adb shell am force-stop dev.mobile.maestro 2>/dev/null || true
            sleep 15
          done
          exit 1
          EOS
          chmod +x "$RUNNER_TEMP/e2e/run.sh"

      - name: Run Maestro E2E on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 35 is only practical with KVM; fall back to API 30 under TCG
          api-level: ${{ steps.kvm.outputs.available == 'true' && 35 || 30 }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 576M
          disk-size: 8G
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: ${{ steps.kvm.outputs.available == 'true' && '-no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none' || '-no-snapshot-save -no-window -accel off -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none' }}
          script: bash ${{ runner.temp }}/e2e/run.sh

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-evidence-${{ github.run_id }}
          path: |
            e2e-evidence/**
            ~/.maestro/tests/**
          if-no-files-found: warn
          retention-days: 7

      - name: Save Gradle dependencies and wrapper cache
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-1
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Save Gradle build cache
        if: always() && steps.gradle-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ steps.gradle-build-cache.outputs.cache-primary-key }}
