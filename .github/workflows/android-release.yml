name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: android-release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Decode Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing-keys
          echo "$KEYSTORE_BASE64" | base64 --decode > signing-keys/dolilonushodan-release.jks
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/signing-keys/dolilonushodan-release.jks" >> $GITHUB_ENV
          chmod 600 signing-keys/dolilonushodan-release.jks

      - name: Decode Firebase Config
        env:
          FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_CONFIG_BASE64 }}
        run: |
          if [ -n "$FIREBASE_CONFIG_BASE64" ]; then
            echo "$FIREBASE_CONFIG_BASE64" | base64 --decode > app/google-services.json
          else
            echo "⚠️  FIREBASE_CONFIG_BASE64 secret not set, skipping Firebase config"
          fi

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK and AAB
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon \
            :app:lintVitalRelease \
            :app:assembleRelease \
            :app:bundleRelease

      - name: Generate Changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v*' $(git rev-list --tags --max-count=1 --skip=1) 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG="## Initial Release v${GITHUB_REF_NAME#v}\n\n- First public release of Dolil Onushodan Android app\n- Features: Shop management, Sales, Purchases, Inventory, Reports\n- Firebase Authentication integrated\n- Room database for local storage\n- Jetpack Compose UI"
          else
            CHANGELOG="## Release ${GITHUB_REF_NAME#v}\n\n### Changes since ${PREVIOUS_TAG}\n\n$(git log --pretty=format:'- %s' ${PREVIOUS_TAG}..HEAD)"
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo -e "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload APK and AAB Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dolil-onushodan-release-assets
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab \
            --title "Dolil Onushodan ${GITHUB_REF_NAME#v}" \
            --notes "${{ steps.changelog.outputs.changelog }}" \
            --latest || \
          gh release upload "${GITHUB_REF_NAME}" \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab \
            --clobber
