name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify, and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: android-release

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must use semantic version format, for example v1.0.0."
            exit 1
          fi

          app_version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ -z "$app_version" ]]; then
            echo "::error::Could not read versionName from app/build.gradle.kts."
            exit 1
          fi

          if [[ "$tag_version" != "$app_version" ]]; then
            echo "::error::Tag version ($tag_version) does not match app versionName ($app_version)."
            exit 1
          fi

      - name: Restore Gradle dependencies and wrapper cache
        id: gradle-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-jdk21-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/gradle-wrapper.properties', 'buildSrc/**/Versions.kt', 'buildSrc/**/Dependencies.kt', 'gradle/*.versions.toml', '**/versions.properties') }}
          restore-keys: |
            ${{ runner.os }}-jdk21-gradle-

      - name: Restore Gradle task output cache
        id: gradle-build-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-jdk21-gradle-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-jdk21-gradle-build-

      - name: Prepare Gradle task output cache directory
        run: mkdir -p ~/.gradle/caches/build-cache-1

      - name: Validate and prepare release signing and Firebase configuration
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_CONFIG_BASE64 }}
        run: |
          set -euo pipefail

          for secret_name in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD FIREBASE_CONFIG_BASE64; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Required android-release environment secret '$secret_name' is not configured."
              exit 1
            fi
          done

          keystore_path="$RUNNER_TEMP/dolilonushodan-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"

          if [[ ! -s "$keystore_path" ]]; then
            echo "::error::Decoded release keystore is empty."
            exit 1
          fi

          # app/build.gradle.kts currently configures this exact release key alias.
          release_sha1_line="$(keytool -list -v -keystore "$keystore_path" -storepass "$STORE_PASSWORD" -alias dolilonushodan | grep -E '^[[:space:]]*SHA1:' | head -n 1 || true)"
          release_sha1_hash="$(printf '%s' "$release_sha1_line" | sed -E 's/^[[:space:]]*SHA1:[[:space:]]*//' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$release_sha1_hash" ]]; then
            echo "::error::Could not extract SHA-1 fingerprint from release keystore alias 'dolilonushodan'."
            exit 1
          fi

          printf '%s' "$FIREBASE_CONFIG_BASE64" | base64 --decode > app/google-services.json

          python3 - app/google-services.json "$release_sha1_hash" <<'PY'
          import json
          import pathlib
          import sys

          config_path = pathlib.Path(sys.argv[1])
          expected_sha1 = sys.argv[2].strip().lower()
          try:
              config = json.loads(config_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as error:
              raise SystemExit(f"Invalid Firebase configuration JSON: {error}") from error

          project_id = config.get("project_info", {}).get("project_id")
          clients = config.get("client", [])
          expected_package = "com.dolil.onushodan"
          matching_clients = [
              client
              for client in clients
              if client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              == expected_package
          ]

          if not project_id or project_id == "dummy-project":
              raise SystemExit("Firebase configuration must contain a real project_id.")
          if not matching_clients:
              raise SystemExit(
                  f"Firebase configuration must include Android package {expected_package}."
              )

          oauth_clients = [
              oauth
              for client in matching_clients
              for oauth in client.get("oauth_client", [])
          ]
          has_web_client = any(oauth.get("client_type") == 3 for oauth in oauth_clients)
          if not has_web_client:
              raise SystemExit(
                  f"Firebase configuration for {expected_package} is missing a Web OAuth client (client_type == 3). Enable Google Sign-In in Firebase Auth and re-export FIREBASE_CONFIG_BASE64."
              )

          android_hashes = [
              (oauth.get("android_info", {}).get("certificate_hash") or "").strip().lower()
              for oauth in oauth_clients
              if oauth.get("client_type") == 1
              and oauth.get("android_info", {}).get("package_name") == expected_package
          ]
          if expected_sha1 not in android_hashes:
              raise SystemExit(
                  f"Firebase configuration for {expected_package} does not include release keystore SHA-1 ({expected_sha1}). Registered hashes: {android_hashes}. Add the release SHA-1 in Firebase Console and update FIREBASE_CONFIG_BASE64."
              )
          PY

      - name: Build, test, and lint release variants
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/dolilonushodan-release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --build-cache --no-configuration-cache --continue --stacktrace --warning-mode all \
            :app:lintRelease \
            :app:assembleRelease \
            :app:bundleRelease

      - name: Save Gradle dependencies and wrapper cache
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-1
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Save Gradle task output cache
        if: always() && steps.gradle-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ steps.gradle-build-cache.outputs.cache-primary-key }}

      - name: Verify signed APK and App Bundle
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          apks=(app/build/outputs/apk/release/*.apk)
          bundles=(app/build/outputs/bundle/release/*.aab)

          if (( ${#apks[@]} == 0 )); then
            echo "::error::No release APK was generated."
            exit 1
          fi
          if (( ${#bundles[@]} == 0 )); then
            echo "::error::No release AAB was generated."
            exit 1
          fi

          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$android_sdk" || ! -d "$android_sdk/build-tools" ]]; then
            echo "::error::Android SDK build-tools directory was not found."
            exit 1
          fi

          apksigner="$(find "$android_sdk/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo "::error::Android apksigner was not found."
            exit 1
          fi

          "$apksigner" verify --verbose "${apks[0]}"
          jarsigner -verify "${bundles[0]}"

      - name: Install pinned Maestro CLI
        if: success()
        env:
          MAESTRO_VERSION: 2.12.1
        run: |
          export MAESTRO_VERSION
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Run Maestro against the signed release APK
        if: success()
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/run-maestro-e2e.sh app/build/outputs/apk/release/app-release.apk

      - name: Upload Maestro E2E evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: maestro-release-evidence-${{ github.ref_name }}
          path: build/maestro-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Remove temporary signing and Firebase files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/dolilonushodan-release.jks" app/google-services.json

      - name: Generate release notes
        id: changelog
        shell: bash
        run: |
          set -euo pipefail

          notes_file="$RUNNER_TEMP/release-notes.md"
          previous_tag=""

          if previous_tag="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_SHA}^" 2>/dev/null)"; then
            {
              printf '## Dolil Onushondhan %s\n\n' "${GITHUB_REF_NAME#v}"
              printf '### Changes since %s\n\n' "$previous_tag"
              git log --no-merges --pretty=format:'- %s' "${previous_tag}..${GITHUB_SHA}"
              printf '\n'
            } > "$notes_file"
          else
            {
              printf '## Dolil Onushondhan %s\n\n' "${GITHUB_REF_NAME#v}"
              printf '### Changes\n\n'
              git log --no-merges --pretty=format:'- %s' "${GITHUB_SHA}"
              printf '\n'
            } > "$notes_file"
          fi

          if [[ ! -s "$notes_file" ]]; then
            echo "::error::Release notes could not be generated."
            exit 1
          fi

      - name: Upload signed APK, AAB, and reports
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dolil-onushondan-release-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::GitHub Release '$GITHUB_REF_NAME' already exists. Refusing to overwrite release assets."
            exit 1
          fi

          mapfile -t release_assets < <(
            find app/build/outputs/apk/release app/build/outputs/bundle/release \
              -type f \( -name '*.apk' -o -name '*.aab' \) -print | sort
          )

          if (( ${#release_assets[@]} < 2 )); then
            echo "::error::Expected both a release APK and AAB before publishing."
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" "${release_assets[@]}" \
            --title "Dolil Onushondhan ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest
