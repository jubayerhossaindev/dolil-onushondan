[build-system]
requires = ["setuptools>=66.0"]
build-backend = "setuptools.build_meta"

[project]
name = "narayanganj-land-pipeline"
version = "1.0.0"
description = "Policy-compliant land-geographic metadata collection and verification pipeline for Narayanganj District"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
browser = ["playwright>=1.44.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
